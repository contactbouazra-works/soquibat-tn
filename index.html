<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem('soquibat-theme');
        } catch {
          preference = null;
        }
        const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : systemPrefersLight ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No static meta description here: every route renders its own <Seo>
      (react-helmet-async) with an accurate title/description. Helmet only
      replaces tags it previously rendered itself, so a static description
      left in this shell would end up duplicated alongside the per-route one
      instead of being replaced.
    -->
    <title>Produits métallurgiques en Tunisie : Soquibat Group</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
