<!doctype html>
<html lang="fr">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No static meta description here: every route renders its own <Seo>
      (react-helmet-async) with an accurate title/description. Helmet only
      replaces tags it previously rendered itself, so a static description
      left in this shell would end up duplicated alongside the per-route one
      instead of being replaced.
    -->
    <title>Produits métallurgiques en Tunisie : Soquibat Group</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
